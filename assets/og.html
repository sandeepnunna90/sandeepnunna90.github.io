<!doctype html>
<!-- Source for og.png (1200x630). Regenerate with headless Chrome:
     "Google Chrome" --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 --screenshot=assets/og.png assets/og.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    box-sizing: border-box; padding: 72px 80px; background: #FFFFFF; color: #111418;
    font-family: Geist, Inter, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between;
    border-bottom: 14px solid #0E6E7E;
  }
  .top { display: flex; align-items: center; gap: 16px; }
  .mark { width: 56px; height: 56px; border-radius: 14px; background: #111418; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 22px; }
  .name { font-size: 30px; font-weight: 600; }
  h1 { margin: 0; font-size: 76px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 600; max-width: 980px; }
  u { text-decoration-color: #0E6E7E; text-decoration-thickness: 7px; text-underline-offset: 12px; text-decoration-skip-ink: none; }
  .meta { font-family: "Geist Mono", ui-monospace, monospace; font-size: 22px; color: #4A525E; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="top"><div class="mark">SN</div><div class="name">Sandeep Nunna</div></div>
  <h1>Software engineer building <u>AI into real products</u>.</h1>
  <div class="meta">Twelve years in production · New York City area</div>
</body>
</html>
